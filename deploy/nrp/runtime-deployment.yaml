apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunar-analyst
  namespace: lunar-analyst
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lunar-analyst
  template:
    metadata:
      labels:
        app: lunar-analyst
    spec:
      containers:
        - name: backend
          image: ghcr.io/replace-me/lunar-analyst-runtime:phase-c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LUNAR_ANALYST_CONFIG_TOML
              value: /etc/lunar-analyst/config/lunar_analyst.container.toml
            - name: LUNAR_ANALYST_WORKSPACE_ROOT
              value: /var/lib/lunar-analyst/workspace
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lunar-analyst-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: LUNAR_ANALYST_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunar-analyst-secrets
                  key: LUNAR_ANALYST_MCP_TOKEN
                  optional: true
          volumeMounts:
            - name: workspace
              mountPath: /var/lib/lunar-analyst/workspace
            - name: runtime-config
              mountPath: /etc/lunar-analyst/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
        - name: ollama
          image: ollama/ollama:latest
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          ports:
            - containerPort: 11434
              name: ollama
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
        - name: ollama-pull-model
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - "sleep 10; curl -X POST http://localhost:11434/api/pull -d '{\"name\": \"gemma4:e4b-it-q8_0\"}'"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: lunar-analyst-workspace
        - name: runtime-config
          configMap:
            name: lunar-analyst-runtime-config
        - name: ollama-data
          emptyDir: {}
      nodeSelector: {}
